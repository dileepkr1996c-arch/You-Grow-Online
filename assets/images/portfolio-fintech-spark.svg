<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fintech-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#fintech-grad)" />

  <!-- Dotted pattern accent grid -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="100" cy="100" r="1.5" />
    <circle cx="200" cy="100" r="1.5" />
    <circle cx="300" cy="100" r="1.5" />
    <circle cx="400" cy="100" r="1.5" />
    <circle cx="500" cy="100" r="1.5" />
    <circle cx="600" cy="100" r="1.5" />
    <circle cx="700" cy="100" r="1.5" />
    
    <circle cx="100" cy="200" r="1.5" />
    <circle cx="200" cy="200" r="1.5" />
    <circle cx="300" cy="200" r="1.5" />
    <circle cx="400" cy="200" r="1.5" />
    <circle cx="500" cy="200" r="1.5" />
    <circle cx="600" cy="200" r="1.5" />
    <circle cx="700" cy="200" r="1.5" />

    <circle cx="100" cy="300" r="1.5" />
    <circle cx="200" cy="300" r="1.5" />
    <circle cx="300" cy="300" r="1.5" />
    <circle cx="400" cy="300" r="1.5" />
    <circle cx="500" cy="300" r="1.5" />
    <circle cx="600" cy="300" r="1.5" />
    <circle cx="700" cy="300" r="1.5" />
  </g>

  <!-- Laptop layout wireframe mockup -->
  <rect x="180" y="80" width="440" height="260" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2" />
  <!-- Screen top address bar -->
  <rect x="180" y="80" width="440" height="35" rx="10" fill="#1e293b" />
  <circle cx="205" cy="98" r="4.5" fill="#ef4444" />
  <circle cx="218" cy="98" r="4.5" fill="#f59e0b" />
  <circle cx="231" cy="98" r="4.5" fill="#10b981" />
  <text x="400" y="103" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#94a3b8" text-anchor="middle">fintechspark.io</text>

  <!-- High Conversions Wireframe Inside Laptop -->
  <text x="400" y="150" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">The Premium Card for Startups</text>
  <rect x="300" y="165" width="200" height="4" rx="2" fill="#6d28d9" />

  <!-- Corporate credit card graphic element wireframe -->
  <g transform="translate(240, 195) rotate(-15)">
    <rect x="0" y="0" width="120" height="75" rx="6" fill="url(#sparkle)" opacity="0.9" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="30" cy="20" r="10" fill="#ffffff" opacity="0.3" />
    <circle cx="40" cy="20" r="10" fill="#ffffff" opacity="0.2" />
    <rect x="20" y="45" width="40" height="6" rx="2" fill="#ffffff" opacity="0.6" />
    <text x="95" y="60" font-family="'Fira Code', monospace" font-size="7" fill="#ffffff" opacity="0.8">SPARK</text>
  </g>

  <!-- Lead Input field form mockup trigger -->
  <rect x="390" y="200" width="190" height="85" rx="8" fill="#1e293b" opacity="0.8" />
  <text x="405" y="222" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#d8b4fe">Request Invite Link</text>
  
  <rect x="405" y="235" width="160" height="18" rx="4" fill="#0f172a" />
  <text x="415" y="247" font-family="'Inter', sans-serif" font-size="8" fill="#4b5563">enter business email...</text>
  
  <rect x="405" y="260" width="160" height="18" rx="4" fill="#a78bfa" />
  <text x="485" y="272" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#1e1b4b" text-anchor="middle">GET EARLY ACCESS</text>

  <!-- Text Highlights Metric badge -->
  <rect x="350" y="305" width="100" height="20" rx="10" fill="#10b981" />
  <text x="400" y="318" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#ffffff" text-anchor="middle">8,400+ SIGNUPS</text>
</svg>
