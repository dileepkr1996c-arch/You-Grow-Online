<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vastra-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f5efe6" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#vastra-grad)" />

  <!-- Organic curves background decorative blobs -->
  <path d="M 0 100 Q 150 200 100 350 T 0 450 Z" fill="#e6dfd3" opacity="0.4" />
  <path d="M 800 50 Q 650 150 700 250 T 800 400 Z" fill="#e6dfd3" opacity="0.4" />

  <!-- E-commerce Window Mockup -->
  <rect x="120" y="60" width="560" height="340" rx="16" fill="#ffffff" stroke="#d5cdbe" stroke-width="2" />
  
  <!-- Window Header -->
  <rect x="120" y="60" width="560" height="45" rx="16" fill="#eaddca" opacity="0.4" />
  <circle cx="150" cy="82" r="5" fill="#f43f5e" />
  <circle cx="165" cy="82" r="5" fill="#eab308" />
  <circle cx="180" cy="82" r="5" fill="#10b981" />
  <text x="400" y="88" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#8c7853" text-anchor="middle">vastra-organics.com</text>

  <!-- E-commerce Storefront Header Navbar -->
  <text x="160" y="132" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16" fill="#431407">VASTRA</text>
  <rect x="250" y="124" width="40" height="8" rx="4" fill="#a28e6c" opacity="0.4" />
  <rect x="305" y="124" width="40" height="8" rx="4" fill="#a28e6c" opacity="0.4" />
  <rect x="360" y="124" width="40" height="8" rx="4" fill="#a28e6c" opacity="0.4" />
  
  <!-- Cart count icon link -->
  <circle cx="615" cy="128" r="10" fill="#431407" opacity="0.1" />
  <path d="M 609 125 L 612 125 L 615 131 L 621 131 L 623 127" fill="none" stroke="#431407" stroke-width="1.8" />

  <!-- Hero Content Grid -->
  <rect x="150" y="160" width="220" height="210" rx="10" fill="#fdfbf7" stroke="#eaddca" />
  <text x="170" y="200" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="18" fill="url(#terracotta)">Fine Linens</text>
  <text x="170" y="220" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#78350f">100% ORGANIC CERTIFIED</text>
  <rect x="170" y="244" width="160" height="6" rx="3" fill="#eae1d4" />
  <rect x="170" y="258" width="130" height="6" rx="3" fill="#eae1d4" />
  <rect x="170" y="272" width="145" height="6" rx="3" fill="#eae1d4" />

  <!-- Buy CTA -->
  <rect x="170" y="305" width="100" height="30" rx="15" fill="#ea580c" />
  <text x="220" y="324" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">SHOP NOW</text>

  <!-- Product visual thumbnail (Wireframe representation of beautiful garments) -->
  <rect x="390" y="160" width="260" height="210" rx="10" fill="#eae1d4" opacity="0.5" />
  <circle cx="520" cy="245" r="45" fill="#f5efe6" />
  <path d="M 520 205 Q 560 245 520 285 T 520 205 Z" fill="#ea580c" opacity="0.15" />
  <text x="520" y="325" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#431407" text-anchor="middle">+88% Sales</text>
  <text x="520" y="342" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#c2410c" text-anchor="middle">WOOCOMMERCE OPTIMIZED</text>
</svg>
