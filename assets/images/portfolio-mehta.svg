  <text x="430" y="228" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="24" fill="#10b981">Ranked #1</text>
  <text x="430" y="250" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#34d399">LOCAL SEO PRIMARY TERMS</text>
  
  <text x="430" y="280" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#a7f3d0">Google Maps index integrated</text>
