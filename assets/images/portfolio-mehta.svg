  <path d="M 271 144 A 4 4 0 0 0 279 144" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <text x="295" y="152" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="13" fill="#ffffff">MEHTA CLINICS</text>

