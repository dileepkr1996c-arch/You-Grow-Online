  <rect x="190" y="240" width="180" height="20" rx="4" fill="#111827" />
  <rect x="196" y="246" width="60" height="8" rx="2" fill="#047857" />
  <circle cx="354" cy="250" r="4" fill="#059669" />

  <rect x="190" y="270" width="180" height="20" rx="4" fill="#111827" />
  <rect x="196" y="276" width="80" height="8" rx="2" fill="#334155" />
  <circle cx="354" cy="280" r="4" fill="#6b7280" />

  <rect x="190" y="300" width="180" height="20" rx="4" fill="#111827" />
