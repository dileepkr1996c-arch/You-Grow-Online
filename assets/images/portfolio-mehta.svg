  </g>

  <!-- Clinic website viewport wireframe -->
  <rect x="140" y="70" width="520" height="310" rx="12" fill="#111827" stroke="#047857" stroke-width="2" />
  <rect x="140" y="70" width="520" height="35" rx="12" fill="#1f2937" />
  
  <!-- Window bullets -->
  <circle cx="165" cy="88" r="4.5" fill="#ef4444" />
  <circle cx="178" cy="88" r="4.5" fill="#f59e0b" />
  <circle cx="191" cy="88" r="4.5" fill="#10b981" />
  
  <!-- Navbar link cards -->
  <rect x="250" y="125" width="300" height="45" rx="8" fill="#1f2937" opacity="0.6" />
  <circle cx="275" cy="147" r="10" fill="url(#emerald-grad)" />
