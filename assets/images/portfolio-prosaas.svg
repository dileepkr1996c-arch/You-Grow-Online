<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="saas-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#saas-grad)" />

  <!-- Background grid wires -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Laptop wireframe view -->
  <rect x="150" y="80" width="500" height="280" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2.5" />
  <!-- Laptop base -->
  <path d="M 100 360 L 700 360 L 720 380 L 80 380 Z" fill="#312e81" stroke="#4f46e5" stroke-width="2.5" />
  <rect x="360" y="360" width="80" height="8" rx="4" fill="#1e1b4b" />

  <!-- Screen Content -->
  <rect x="170" y="100" width="460" height="240" fill="#0b0f19" rx="4" />
  
  <!-- Headline representation -->
  <text x="400" y="145" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">Automated SaaS Platform</text>
  <rect x="250" y="165" width="300" height="10" rx="5" fill="url(#cyan-lime)" />
  <rect x="300" y="182" width="200" height="5" rx="2.5" fill="#312e81" />
  
  <!-- Content splits -->
  <rect x="190" y="210" width="200" height="110" rx="6" fill="#1e293b" opacity="0.8" />
  <!-- Tiny chart blocks -->
  <path d="M 205 290 Q 235 240 265 270 T 325 230 C 355 240 365 290 375 290" fill="none" stroke="#06b6d4" stroke-width="3" />
  <circle cx="325" cy="230" r="4" fill="#06b6d4" />
  
  <rect x="410" y="210" width="200" height="110" rx="6" fill="#1e293b" opacity="0.8" />
  <text x="430" y="245" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" fill="#10b981">28.4%</text>
  <text x="430" y="265" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#94a3b8">CONVERSION PPC RATE</text>
  <rect x="430" y="285" width="130" height="6" rx="3" fill="#312e81" />
</svg>
