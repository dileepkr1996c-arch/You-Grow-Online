<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="elite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#elite-grad)" />

  <!-- Dotted Grid Pattern Accent -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="2" fill="#ffffff" />
    <circle cx="150" cy="50" r="2" fill="#ffffff" />
    <circle cx="250" cy="50" r="2" fill="#ffffff" />
    <circle cx="350" cy="50" r="2" fill="#ffffff" />
    <circle cx="450" cy="50" r="2" fill="#ffffff" />
    <circle cx="550" cy="50" r="2" fill="#ffffff" />
    <circle cx="650" cy="50" r="2" fill="#ffffff" />
    <circle cx="750" cy="50" r="2" fill="#ffffff" />

    <circle cx="50" cy="150" r="2" fill="#ffffff" />
    <circle cx="150" cy="150" r="2" fill="#ffffff" />
    <circle cx="250" cy="150" r="2" fill="#ffffff" />
    <circle cx="350" cy="150" r="2" fill="#ffffff" />
    <circle cx="450" cy="150" r="2" fill="#ffffff" />
    <circle cx="550" cy="150" r="2" fill="#ffffff" />
    <circle cx="650" cy="150" r="2" fill="#ffffff" />
    <circle cx="750" cy="150" r="2" fill="#ffffff" />

    <circle cx="50" cy="250" r="2" fill="#ffffff" />
    <circle cx="150" cy="250" r="2" fill="#ffffff" />
    <circle cx="250" cy="250" r="2" fill="#ffffff" />
    <circle cx="350" cy="250" r="2" fill="#ffffff" />
    <circle cx="450" cy="250" r="2" fill="#ffffff" />
    <circle cx="550" cy="250" r="2" fill="#ffffff" />
    <circle cx="650" cy="250" r="2" fill="#ffffff" />
    <circle cx="750" cy="250" r="2" fill="#ffffff" />

    <circle cx="50" cy="350" r="2" fill="#ffffff" />
    <circle cx="150" cy="350" r="2" fill="#ffffff" />
    <circle cx="250" cy="350" r="2" fill="#ffffff" />
    <circle cx="350" cy="350" r="2" fill="#ffffff" />
    <circle cx="450" cy="350" r="2" fill="#ffffff" />
    <circle cx="550" cy="350" r="2" fill="#ffffff" />
    <circle cx="650" cy="350" r="2" fill="#ffffff" />
    <circle cx="750" cy="350" r="2" fill="#ffffff" />
  </g>

  <!-- Dashboard Window Representation -->
  <rect x="100" y="80" width="600" height="320" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <rect x="100" y="80" width="600" height="40" rx="12" fill="#0f172a" />
  <!-- Window buttons -->
  <circle cx="130" cy="100" r="6" fill="#ef4444" />
  <circle cx="150" cy="100" r="6" fill="#f59e0b" />
  <circle cx="170" cy="100" r="6" fill="#10b981" />
  <text x="400" y="105" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#64748b" text-anchor="middle">elitecapital-advisory.com</text>

  <!-- Sidebar Wireframe -->
  <rect x="120" y="140" width="120" height="240" rx="6" fill="#0f172a" opacity="0.5" />
  <rect x="132" y="160" width="96" height="12" rx="3" fill="#334155" />
  <rect x="132" y="185" width="80" height="8" rx="3" fill="#1e293b" />
  <rect x="132" y="205" width="88" height="8" rx="3" fill="#1e293b" />
  <rect x="132" y="225" width="64" height="8" rx="3" fill="#1e293b" />

  <!-- Content cards wireframe -->
  <rect x="260" y="140" width="280" height="130" rx="8" fill="#0f172a" opacity="0.6" />
  <text x="280" y="175" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="url(#accent-grad)">Elite Capital</text>
  <text x="280" y="195" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#94a3b8">FINANCIAL CONSULTING PLATFORM</text>
  
  <rect x="280" y="215" width="240" height="6" rx="3" fill="#1e293b" />
  <rect x="280" y="228" width="180" height="6" rx="3" fill="#1e293b" />
  <rect x="280" y="241" width="210" height="6" rx="3" fill="#1e293b" />

  <!-- Tiny Charts list -->
  <rect x="560" y="140" width="120" height="60" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2 2" />
  <text x="620" y="165" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#f59e0b" text-anchor="middle">+142%</text>
  <text x="620" y="182" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#94a3b8" text-anchor="middle">LEAD GROWTH</text>

  <rect x="560" y="210" width="120" height="60" rx="8" fill="#0f172a" />
  <path d="M 570 255 L 590 245 L 610 230 L 630 240 L 650 220 L 670 225" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="260" y="285" width="420" height="95" rx="8" fill="#0f172a" opacity="0.3" />
  <!-- Vector layout block -->
  <line x1="280" y1="330" x2="660" y2="330" stroke="#1e293b" stroke-width="2" />
  <circle cx="295" cy="330" r="12" fill="#d97706" opacity="0.4" />
  <path d="M 290 330 L 293 333 L 300 326" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
  <rect x="315" y="325" width="200" height="10" rx="4" fill="#334155" />
</svg>
