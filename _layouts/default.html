<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="{% if page.keywords %}{{ page.keywords }}{% else %}digital agency, web development, ecommerce development, custom software, digital marketing, SEO, Google Ads, Facebook Ads, AI solutions{% endif %}">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  {% seo %}
  {% if page.url == '/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "You Grow Online",
    "url": "https://yougrowonline.in",
    "logo": "https://yougrowonline.in/assets/images/logo.png",
    "description": "Premium digital agency specializing in website development, ecommerce, custom software, digital marketing, and AI solutions.",
    "address": { "@type": "PostalAddress", "addressCountry": "IN" },
    "sameAs": [
      "https://facebook.com/yougrowonline",
      "https://twitter.com/yougrowonline",
      "https://linkedin.com/company/yougrowonline"
    ],
    "priceRange": "$$",
    "telephone": "+91-89718-35181",
    "email": "contact.yougrowonline@gmail.com"
  }
  </script>
  {% endif %}
  {% if page.layout == 'post' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.description | escape }}",
    "image": "{{ page.image | absolute_url }}",
    "datePublished": "{{ page.date | date: '%Y-%m-%dT%H:%M:%S%z' }}",
    "author": {
      "@type": "Organization",
      "name": "You Grow Online"
    },
    "publisher": {
      "@type": "Organization",
      "name": "You Grow Online",
      "logo": {
        "@type": "ImageObject",
        "url": "https://yougrowonline.in/assets/images/logo.png"
      }
    }
  }
 </head>
<body>

  <div class="preloader"><div class="preloader-logo"></div></div>

  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  <script src="/assets/js/main.js"></script>
  <!-- /23002577677/YGO_Home_Header -->
<div id='div-gpt-ad-1783499340638-0' style='min-width: 728px; min-height: 90px;'>
  <script>
    googletag.cmd.push(function() { googletag.display('div-gpt-ad-1783499340638-0'); });
  </script>
</div>

</body>
</html>
