title: You Grow Online
tagline: Digital Solution Agency
description: >-
  Premium digital agency building modern websites, ecommerce stores, custom software,
  and data-driven marketing campaigns. Google Ads, Facebook Ads, SEO & AI solutions.
url: https://yougrowonline.in
baseurl: ""
lang: en

# Build settings
markdown: kramdown
permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-include-cache

# Exclude from processing
exclude:
  - README.md
  - SHEETS_SETUP.md
  - package.json
  - node_modules
  - Gemfile
  - Gemfile.lock
  - vendor

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /blog/:title/
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# SEO tag settings
social:
  name: You Grow Online
  links:
    - https://facebook.com/yougrowonline
    - https://twitter.com/yougrowonline
    - https://linkedin.com/company/yougrowonline

logo: /assets/images/logo.png

format: "YYYY-MM-DD HH:mm:ss"
    date_format: "YYYY-MM-DD"

    - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD" }
